name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Фронтенд
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Сборка
        run: cargo build --release
      - name: Упаковка
        shell: pwsh
        run: |
          Copy-Item target/release/wireproxy-control.exe wireproxy-control-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: wireproxy-control-windows-x64.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Фронтенд
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Сборка (arm64 + x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Universal
        run: |
          lipo -create -output wireproxy-control-macos-universal \
            target/aarch64-apple-darwin/release/wireproxy-control \
            target/x86_64-apple-darwin/release/wireproxy-control
          chmod +x wireproxy-control-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: wireproxy-control-macos-universal

  sidecar-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Сборка headless sidecar
        shell: pwsh
        working-directory: sidecar/tgws
        run: ./build.ps1
      - name: Упаковка
        shell: pwsh
        run: |
          Copy-Item sidecar/tgws/dist/tgws-proxy.exe tgws-proxy-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-windows
          path: tgws-proxy-windows-x64.exe

  sidecar-macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Сборка headless sidecar
        run: bash sidecar/tgws/build.sh
      - name: Упаковка
        run: |
          cp sidecar/tgws/dist/tgws-proxy tgws-proxy-macos-arm64
          chmod +x tgws-proxy-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-macos-arm64
          path: tgws-proxy-macos-arm64

  sidecar-macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Сборка headless sidecar
        run: bash sidecar/tgws/build.sh
      - name: Упаковка
        run: |
          cp sidecar/tgws/dist/tgws-proxy tgws-proxy-macos-x64
          chmod +x tgws-proxy-macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-macos-x64
          path: tgws-proxy-macos-x64

  release:
    needs:
      [
        windows,
        macos,
        sidecar-windows,
        sidecar-macos-arm64,
        sidecar-macos-x64,
      ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Манифест sidecar
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          version = open('sidecar/tgws/VERSION', encoding='utf-8').read().strip()
          base = 'https://github.com/devcustrom/vless-pac-proxy/releases/latest/download'
          names = {
              'windows-x64': ('artifacts/sidecar-windows/tgws-proxy-windows-x64.exe', 'tgws-proxy-windows-x64.exe'),
              'macos-arm64': ('artifacts/sidecar-macos-arm64/tgws-proxy-macos-arm64', 'tgws-proxy-macos-arm64'),
              'macos-x64': ('artifacts/sidecar-macos-x64/tgws-proxy-macos-x64', 'tgws-proxy-macos-x64'),
          }
          assets = {}
          for key, (path, asset) in names.items():
              data = open(path, 'rb').read()
              assets[key] = {
                  'url': f'{base}/{asset}',
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
              }
          with open('artifacts/tgws-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump({'version': version, 'assets': assets}, fh, ensure_ascii=False, indent=2)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/wireproxy-control-windows-x64.exe
            artifacts/macos/wireproxy-control-macos-universal
            artifacts/sidecar-windows/tgws-proxy-windows-x64.exe
            artifacts/sidecar-macos-arm64/tgws-proxy-macos-arm64
            artifacts/sidecar-macos-x64/tgws-proxy-macos-x64
            artifacts/tgws-manifest.json
