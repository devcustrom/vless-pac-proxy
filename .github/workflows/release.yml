name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Сборка
        run: cargo build --release
      - name: Упаковка
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/wireproxy-control.exe dist/
          Copy-Item README.md dist/
          Copy-Item README-MAC.md dist/
          Compress-Archive -Path dist/* -DestinationPath "wireproxy-control-${{ github.ref_name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: wireproxy-control-*-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Сборка (arm64 + x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Universal + упаковка
        run: |
          lipo -create -output wireproxy-control \
            target/aarch64-apple-darwin/release/wireproxy-control \
            target/x86_64-apple-darwin/release/wireproxy-control
          chmod +x wireproxy-control
          mkdir -p dist
          cp wireproxy-control README.md README-MAC.md dist/
          (cd dist && zip -r "../wireproxy-control-${GITHUB_REF_NAME}-macos-universal.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: wireproxy-control-*-macos-universal.zip

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
