name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Фронтенд
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Сборка
        run: cargo build --release
      - name: Упаковка
        shell: pwsh
        run: |
          Copy-Item target/release/wireproxy-control.exe wireproxy-control-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: wireproxy-control-windows-x64.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Фронтенд
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Сборка (arm64 + x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Universal
        run: |
          lipo -create -output wireproxy-control-macos-universal \
            target/aarch64-apple-darwin/release/wireproxy-control \
            target/x86_64-apple-darwin/release/wireproxy-control
          chmod +x wireproxy-control-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: wireproxy-control-macos-universal

  sidecar-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Сборка headless sidecar
        shell: pwsh
        working-directory: sidecar/tgws
        run: ./build.ps1
      - name: Манифест обновления
        shell: pwsh
        run: |
          $version = (Get-Content sidecar/tgws/VERSION -Raw).Trim()
          $file = "tgws-proxy-windows-x64.exe"
          Copy-Item sidecar/tgws/dist/tgws-proxy.exe $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $file).Length
          $url = "https://github.com/devcustrom/vless-pac-proxy/releases/latest/download/$file"
          $manifest = @{
            version = $version
            assets = @{
              "windows-x64" = @{
                url = $url
                sha256 = $hash
                size = $size
              }
            }
          } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "tgws-manifest.json"),
            $manifest,
            (New-Object System.Text.UTF8Encoding($false))
          )
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar
          path: |
            tgws-proxy-windows-x64.exe
            tgws-manifest.json

  release:
    needs: [windows, macos, sidecar-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/wireproxy-control-windows-x64.exe
            artifacts/macos/wireproxy-control-macos-universal
            artifacts/sidecar/tgws-proxy-windows-x64.exe
            artifacts/sidecar/tgws-manifest.json
