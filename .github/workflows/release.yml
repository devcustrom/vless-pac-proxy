name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      android_enabled: ${{ steps.android.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Версия совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          web=$(python3 -c "import json; print(json.load(open('web/package.json'))['version'])")
          echo "tag=$tag cargo=$cargo web=$web"
          test "$tag" = "$cargo"
          test "$tag" = "$web"
      - name: Android signing configured?
        id: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android release secrets are not configured; APK asset will be skipped"
          fi

  windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Фронтенд
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Сборка
        run: cargo build --release
      - name: Упаковка
        shell: pwsh
        run: |
          Copy-Item target/release/wireproxy-control.exe wireproxy-control-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: wireproxy-control-windows-x64.exe

  macos:
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Фронтенд
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Сборка (arm64 + x86_64)
        run: |
          # Явный deployment target: иначе Rust ставит минимальную macOS
          # сборочного раннера, и у пользователей всплывает «Use Software
          # Update in System Settings».
          MACOSX_DEPLOYMENT_TARGET=11.0 cargo build --release --target aarch64-apple-darwin
          MACOSX_DEPLOYMENT_TARGET=10.13 cargo build --release --target x86_64-apple-darwin
      - name: Universal
        run: |
          lipo -create -output wireproxy-control-macos-universal \
            target/aarch64-apple-darwin/release/wireproxy-control \
            target/x86_64-apple-darwin/release/wireproxy-control
          chmod +x wireproxy-control-macos-universal
          # Apple Silicon не запускает неподписанные Mach-O: ad-hoc подпись
          # нужна и для .app, и для отдельного бинарника из Releases.
          codesign --force --sign - wireproxy-control-macos-universal
      - name: Иконка приложения
        run: |
          set -euo pipefail
          mkdir -p AppIcon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/AppIcon.png \
              --out "AppIcon.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/AppIcon.png \
              --out "AppIcon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o AppIcon.icns
      - name: .app, zip и dmg
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          APP="WireproxyControl.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp wireproxy-control-macos-universal "$APP/Contents/MacOS/wireproxy-control"
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          chmod +x "$APP/Contents/MacOS/wireproxy-control"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>com.devcustrom.wireproxy-control</string>
            <key>CFBundleName</key><string>wireproxy-control</string>
            <key>CFBundleDisplayName</key><string>WireproxyControl</string>
            <key>CFBundleExecutable</key><string>wireproxy-control</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          xattr -cr "$APP" || true
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" wireproxy-control-macos-universal.zip

          # DMG с иконкой, фоном и ссылкой на Applications: обычный
          # drag-to-install вместо окна с одиноким бинарником.
          brew list create-dmg >/dev/null 2>&1 || brew install create-dmg || true
          STAGE="dmg-stage"
          DMG="wireproxy-control-macos-universal.dmg"
          rm -rf "$STAGE" "$DMG"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          if ! create-dmg \
            --volname "wireproxy-control" \
            --volicon AppIcon.icns \
            --background assets/dmg-background.png \
            --window-pos 200 120 \
            --window-size 640 420 \
            --icon-size 128 \
            --icon "WireproxyControl.app" 170 210 \
            --hide-extension "WireproxyControl.app" \
            --app-drop-link 470 210 \
            "$DMG" "$STAGE"; then
            echo "create-dmg не сработал — собираю простой DMG со ссылкой на Applications"
            rm -f "$DMG"
            ln -sfn /Applications "$STAGE/Applications"
            hdiutil create -volname "wireproxy-control" -srcfolder "$STAGE" \
              -ov -format UDZO "$DMG"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            wireproxy-control-macos-universal
            wireproxy-control-macos-universal.zip
            wireproxy-control-macos-universal.dmg

  sidecar-windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Сборка headless sidecar
        shell: pwsh
        working-directory: sidecar/tgws
        run: ./build.ps1
      - name: Упаковка
        shell: pwsh
        run: |
          Copy-Item sidecar/tgws/dist/tgws-proxy.exe tgws-proxy-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-windows
          path: tgws-proxy-windows-x64.exe

  sidecar-macos-arm64:
    needs: preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Сборка headless sidecar
        run: bash sidecar/tgws/build.sh
      - name: Упаковка
        run: |
          cp sidecar/tgws/dist/tgws-proxy tgws-proxy-macos-arm64
          chmod +x tgws-proxy-macos-arm64
          codesign --force --sign - tgws-proxy-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-macos-arm64
          path: tgws-proxy-macos-arm64

  sidecar-macos-x64:
    needs: preflight
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Сборка headless sidecar
        run: bash sidecar/tgws/build.sh
      - name: Упаковка
        run: |
          cp sidecar/tgws/dist/tgws-proxy tgws-proxy-macos-x64
          chmod +x tgws-proxy-macos-x64
          codesign --force --sign - tgws-proxy-macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-macos-x64
          path: tgws-proxy-macos-x64

  android:
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/') && needs.preflight.outputs.android_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: libXray AAR
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 \
            -o /tmp/libxray.zip \
            https://github.com/XTLS/libXray/releases/download/v26.11.9/libxray-android.zip
          unzip -j /tmp/libxray.zip libxray-android/libXray.aar \
            -d mobile/android/app/libs/
      - name: Decode release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build signed APK
        working-directory: mobile/android
        env:
          WIREPROXY_ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          WIREPROXY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WIREPROXY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WIREPROXY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          VERSION="${APP_VERSION_NAME#v}"
          CODE=$(python3 - <<'PY'
          import os, re
          v = os.environ["APP_VERSION_NAME"].lstrip("v")
          p = [int(x) for x in re.findall(r"\d+", v)[:3]]
          p += [0] * (3 - len(p))
          if p[0] > 20 or p[1] > 99 or p[2] > 999999:
              raise SystemExit(f"unsupported version {v}: use major<=20, minor<=99, patch<=999999")
          print(p[0] * 100000000 + p[1] * 1000000 + p[2])
          PY
          )
          ./gradlew :app:assembleRelease --console=plain \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$CODE"
      - name: Package APK
        run: |
          set -euo pipefail
          cp mobile/android/app/build/outputs/apk/release/app-release.apk wireproxy-control-android.apk
          sha256sum wireproxy-control-android.apk > wireproxy-control-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            wireproxy-control-android.apk
            wireproxy-control-android.apk.sha256

  release:
    needs:
      [
        preflight,
        windows,
        macos,
        sidecar-windows,
        sidecar-macos-arm64,
        sidecar-macos-x64,
        android,
      ]
    # Android is optional: if its signing secrets are absent or the APK build
    # fails, desktop/sidecar assets are still published (the workflow stays red).
    if: >-
      startsWith(github.ref, 'refs/tags/') && always() && !cancelled() &&
      needs.windows.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.sidecar-windows.result == 'success' &&
      needs.sidecar-macos-arm64.result == 'success' &&
      needs.sidecar-macos-x64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Манифест sidecar
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          version = open('sidecar/tgws/VERSION', encoding='utf-8').read().strip()
          base = 'https://github.com/devcustrom/vless-pac-proxy/releases/latest/download'
          names = {
              'windows-x64': ('artifacts/sidecar-windows/tgws-proxy-windows-x64.exe', 'tgws-proxy-windows-x64.exe'),
              'macos-arm64': ('artifacts/sidecar-macos-arm64/tgws-proxy-macos-arm64', 'tgws-proxy-macos-arm64'),
              'macos-x64': ('artifacts/sidecar-macos-x64/tgws-proxy-macos-x64', 'tgws-proxy-macos-x64'),
          }
          assets = {}
          for key, (path, asset) in names.items():
              data = open(path, 'rb').read()
              assets[key] = {
                  'url': f'{base}/{asset}',
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
              }
          with open('artifacts/tgws-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump({'version': version, 'assets': assets}, fh, ensure_ascii=False, indent=2)
          PY
      - name: Собрать release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp artifacts/windows/wireproxy-control-windows-x64.exe release-assets/
          cp artifacts/macos/wireproxy-control-macos-universal release-assets/
          cp artifacts/macos/wireproxy-control-macos-universal.zip release-assets/
          cp artifacts/macos/wireproxy-control-macos-universal.dmg release-assets/
          cp artifacts/sidecar-windows/tgws-proxy-windows-x64.exe release-assets/
          cp artifacts/sidecar-macos-arm64/tgws-proxy-macos-arm64 release-assets/
          cp artifacts/sidecar-macos-x64/tgws-proxy-macos-x64 release-assets/
          cp artifacts/tgws-manifest.json release-assets/
          if [ -f artifacts/android/wireproxy-control-android.apk ]; then
            cp artifacts/android/wireproxy-control-android.apk release-assets/
            cp artifacts/android/wireproxy-control-android.apk.sha256 release-assets/
          fi
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: release-assets/*
