[package]
name = "wireproxy-mobile-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "wireproxy_mobile_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[workspace]
